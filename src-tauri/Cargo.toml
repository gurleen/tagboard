[package]
name = "tagboard"
version = "0.1.0"
description = "Tagboard control panel and video board renderer"
authors = ["Gurleen Singh"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tagboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `protocol-asset` backs the `asset:` scheme the board window uses to render
# cached media straight off disk; it must match `assetProtocol` in tauri.conf.json.
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
include_dir = "0.7"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "webpki-roots",
  "http2",
  "charset",
  "gzip",
  "brotli",
  "system-proxy",
  "json",
] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
